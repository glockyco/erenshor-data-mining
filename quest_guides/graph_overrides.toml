# ── Reliquary planning table ─────────────────────────────────────────────
# PlanningTable (MonoBehaviour 34075) belongs to PlanningDesk (GameObject 6522).
# Transform 13251 has no parent, so its local position is its world position.
# PlanningTableUI.Portal holds the Box of Portals in LoadScene's portal slot.
[[nodes]]
key = "planningtable:reliquary:267.40:0.09:321.30"
type = "item_bag"
display_name = "Planning Table"
scene = "Reliquary"
zone = "Reliquary Hall"
zone_key = "zone:reliquary"
x = 267.39566
y = 0.09062946
z = 321.30356
description = "Take it from the planning table's portal slot."

[[edges]]
source = "planningtable:reliquary:267.40:0.09:321.30"
target = "item:gen - box of portals"
type = "yields_item"

# QuestSpawnListener (MonoBehaviour 34120) enables PlanningDesk only once
# "Claiming the Reliquary" is complete, so the table exists only after it.
[[gates]]
subject_kind = "item_bag"
subject = "planningtable:reliquary:267.40:0.09:321.30"
gate = "override:planning_desk"
groups = [[{ kind = "quest_done", ref = "quest:claimreliquary" }]]
