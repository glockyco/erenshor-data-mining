# Guide-only nodes, edges, gates and reviewed player instructions.
# Shared game facts belong in the clean database. Spatial containment
# belongs in barriers.toml.
#
# A gate holds when every atom of one of its groups holds. Gates on one
# subject combine with AND, also with the gates of the clean database.

# ── Jaws of Sivakaya ────────────────────────────────────────────────────

# The clean piety barrier already gates Vessel Siraethe's spawn. This gate stays
# because quest rewards list unlocked characters only from gates on characters.
[[gates]]
subject_kind = "character"
subject = "character:siraethe"
gate = "override:piety"
groups = [[{ kind = "quest_done", ref = "quest:jawspiety" }]]

# ── Reliquary planning table ─────────────────────────────────────────────
# PlanningTable (MonoBehaviour 34075) belongs to PlanningDesk (GameObject 6522).
# Transform 13251 has no parent, so its local position is its world position.
# PlanningTableUI.Portal holds the Box of Portals in LoadScene's portal slot.
[[nodes]]
key = "planningtable:reliquary:267.40:0.09:321.30"
type = "item_bag"
display_name = "Planning Table"
scene = "Reliquary"
zone = "Reliquary Hall"
zone_key = "zone:reliquary"
x = 267.39566
y = 0.09062946
z = 321.30356
description = "Take it from the planning table's portal slot."

[[edges]]
source = "planningtable:reliquary:267.40:0.09:321.30"
target = "item:gen - box of portals"
type = "yields_item"

# QuestSpawnListener (MonoBehaviour 34120) enables PlanningDesk only once
# "Claiming the Reliquary" is complete, so the table exists only after it.
[[gates]]
subject_kind = "item_bag"
subject = "planningtable:reliquary:267.40:0.09:321.30"
gate = "override:planning_desk"
groups = [[{ kind = "quest_done", ref = "quest:claimreliquary" }]]

# Wording names the visible brazier and the optional way to summon rain.
# The release mechanism and referenced item are checked against current data.
[[source_notes]]
source = "character:evadne"
mechanism = "npc_protector_weather"
items = ["item:ring - 20 - tempestalia"]
text = "Rain puts out her brazier and makes her vulnerable. Tempestalia, Ring of Storms can summon rain."

[[source_notes]]
source = "character:warded phantom:shiveringtomb2:-76.96:-68.40:284.89"
mechanism = "shivering_phantom_wards"
text = "Defeat both Phantom's Wards to make Warded Shadow vulnerable."
