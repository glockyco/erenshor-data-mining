# Guide-only nodes, edges, and gates for scripted content that the export
# does not record yet. Facts every consumer needs belong in the clean
# database: corrections in mapping.json, what keyed doors guard in
# barriers.toml.
#
# A gate holds when every atom of one of its groups holds. Gates on one
# subject combine with AND, also with the gates of the clean database.

# ── Jaws of Sivakaya ────────────────────────────────────────────────────

# MemorySphere shows a Memory of Sivakaya statue while the player stands
# near it with the Nighthollow Candle in the inventory.
[[gates]]
subject_kind = "character"
subject = "character:memorystatue (1):jaws:1183.73:0.87:235.21"
gate = "override:memory_sphere"
groups = [[{ kind = "item_held", ref = "item:hand - 100 - the nighthollow candle" }]]

[[gates]]
subject_kind = "character"
subject = "character:memorystatue (1):jaws:1407.73:-9.46:109.21"
gate = "override:memory_sphere"
groups = [[{ kind = "item_held", ref = "item:hand - 100 - the nighthollow candle" }]]

# Vessel Siraethe requires A Pious Guest quest completed.
[[gates]]
subject_kind = "character"
subject = "character:siraethe"
gate = "override:piety"
groups = [[{ kind = "quest_done", ref = "quest:jawspiety" }]]

# ── The Duskenlight Coast → Jaws of Sivakaya ────────────────────────────

# The Nighthollow Candle or She Sees You opens this zone line.
[[gates]]
subject_kind = "zone_line"
subject = "zoneline:duskenlight:jaws:989.40:148.67:53.90"
gate = "override:jaws_entry"
groups = [
    [{ kind = "item_held", ref = "item:hand - 100 - the nighthollow candle" }],
    [{ kind = "quest_done", ref = "quest:jawsseen" }],
]

