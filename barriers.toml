# Barriers: objects that block access until their mechanism opens them. Every
# object that a mechanism opens must appear in one record. A record has a kind
# (door, removed, moved, or guardians), a name, its objects, the targets they
# guard, a reason, and the check that confirmed the targets (navmesh, render, or
# unconfirmed). The first object names the barrier and every gate it causes. [[entries]] name targets that only some of the zone
# lines into their scene reach. See README.md (Concepts) for how both are reviewed.

