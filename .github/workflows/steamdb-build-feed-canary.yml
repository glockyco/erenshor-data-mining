name: SteamDB Build Feed Canary

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  steamdb-build-feed:
    name: Check SteamDB build feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3

      - name: Run SteamDB build feed canary
        run: nix develop --command pytest tests/integration/test_build_feed_canary.py -m canary -v
