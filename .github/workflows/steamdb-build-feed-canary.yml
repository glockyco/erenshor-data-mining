name: SteamDB Build Feed Canary

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  steamdb-build-feed:
    name: Check SteamDB build feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Run SteamDB build feed canary
        run: nix develop --command uv run pytest tests/integration/test_build_feed_canary.py -m canary -v
