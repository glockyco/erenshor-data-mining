name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new workflow is triggered on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff linter
        run: uv run ruff check src/ tests/

      - name: Run ruff formatter check
        run: uv run ruff format --check src/ tests/

  lint-csharp:
    name: Lint C#
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore tools
        run: dotnet tool restore
        working-directory: src/mods/InteractiveMapCompanion

      - name: Check formatting
        run: dotnet csharpier --check .
        working-directory: src/mods/InteractiveMapCompanion

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run mypy type checking
        run: uv run mypy src/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-unit:
    name: Test Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit leaf with coverage
        run: uv run erenshor test unit --coverage

      - name: Upload unit report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-unit
          path: |
            artifacts/test-reports/unit.json
            coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-contract:
    name: Test Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up .NET 9 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install dependencies
        run: uv sync --dev

      - name: Run contract leaf
        run: uv run erenshor test contract

      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-contract
          path: |
            artifacts/test-reports/contract.json
            artifacts/test-reports/native/contract/*.trx
          if-no-files-found: error

  test-maps:
    name: Test Maps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          uv sync --dev
          pnpm install --frozen-lockfile

      - name: Run maps leaf
        run: uv run erenshor test maps

      - name: Upload maps report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-maps
          path: artifacts/test-reports/maps.json
          if-no-files-found: error

  test-mods:
    name: Test Mods
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up .NET 9 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install dependencies
        run: uv sync --dev

      - name: Run mods leaf
        run: uv run erenshor test mods

      - name: Upload mod reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-mods
          path: |
            artifacts/test-reports/mods.json
            artifacts/test-reports/native/mods/*.trx
          if-no-files-found: error

  # Unity export and the dynamic-spawn gate remain explicit post-update workflows.

  # Summary job that all other jobs depend on
  # This makes it easy to require a single status check for branch protection
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [lint-python, lint-csharp, type-check, security, test-unit, test-contract, test-maps, test-mods]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint-python.result }}" != "success" ]] || \
             [[ "${{ needs.lint-csharp.result }}" != "success" ]] || \
             [[ "${{ needs.type-check.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.test-unit.result }}" != "success" ]] || \
             [[ "${{ needs.test-contract.result }}" != "success" ]] || \
             [[ "${{ needs.test-maps.result }}" != "success" ]] || \
             [[ "${{ needs.test-mods.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
