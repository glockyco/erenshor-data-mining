name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new workflow is triggered on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Restore tools
        run: nix develop --command dotnet tool restore

      - name: Run static leaf
        run: nix develop --command uv run erenshor test static

      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-static
          path: artifacts/test-reports/static.json
          if-no-files-found: error

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-unit:
    name: Test Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Run unit leaf with coverage
        run: nix develop --command uv run erenshor test unit --coverage

      - name: Upload unit report and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-unit
          path: |
            artifacts/test-reports/unit.json
            coverage.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-contract:
    name: Test Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Run contract leaf
        run: nix develop --command uv run erenshor test contract

      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-contract
          path: |
            artifacts/test-reports/contract.json
            artifacts/test-reports/native/contract/*.trx
          if-no-files-found: error

  test-maps:
    name: Test Maps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Install map dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Run maps leaf
        run: nix develop --command uv run erenshor test maps

      - name: Upload maps report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-maps
          path: artifacts/test-reports/maps.json
          if-no-files-found: error

  test-mods:
    name: Test Mods
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Run mods leaf
        run: nix develop --command uv run erenshor test mods

      - name: Upload mod reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-mods
          path: |
            artifacts/test-reports/mods.json
            artifacts/test-reports/native/mods/*.trx
          if-no-files-found: error

  # Unity export and the dynamic-spawn gate remain explicit post-update workflows.

  # Summary job that all other jobs depend on
  # This makes it easy to require a single status check for branch protection
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [static, security, test-unit, test-contract, test-maps, test-mods]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.static.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.test-unit.result }}" != "success" ]] || \
             [[ "${{ needs.test-contract.result }}" != "success" ]] || \
             [[ "${{ needs.test-maps.result }}" != "success" ]] || \
             [[ "${{ needs.test-mods.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
