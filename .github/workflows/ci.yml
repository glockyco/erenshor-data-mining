name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new workflow is triggered on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff linter
        run: uv run ruff check src/ tests/

      - name: Run ruff formatter check
        run: uv run ruff format --check src/ tests/

  lint-csharp:
    name: Lint C#
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore tools
        run: dotnet tool restore
        working-directory: src/mods/InteractiveMapCompanion

      - name: Check formatting
        run: dotnet csharpier --check .
        working-directory: src/mods/InteractiveMapCompanion

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run mypy type checking
        run: uv run mypy src/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=src/erenshor \
            --cov-report=xml \
            --cov-branch \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-native-analyzers:
    name: Native Analyzer Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CodeFacts
            project: src/tools/CodeFacts/tests/CodeFacts.Tests/CodeFacts.Tests.csproj
          - name: ExportSurface
            project: src/tools/ExportSurface/tests/ExportSurface.Tests/ExportSurface.Tests.csproj
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 9 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Run ${{ matrix.name }} tests
        run: |
          dotnet test "${{ matrix.project }}" \
            -c Release \
            --logger "trx;LogFileName=${{ matrix.name }}.trx" \
            --results-directory "$RUNNER_TEMP/test-results/${{ matrix.name }}" \
            -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload ${{ matrix.name }} TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-analyzer-${{ matrix.name }}-trx
          path: ${{ runner.temp }}/test-results/${{ matrix.name }}/*.trx
          if-no-files-found: error

  test-native-mods:
    name: Native Mod Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AdventureGuide
            project: src/mods/AdventureGuide/tests/AdventureGuide.Tests/AdventureGuide.Tests.csproj
            loader: lunaris
          - name: InteractiveMapCompanion
            project: src/mods/InteractiveMapCompanion/tests/InteractiveMapCompanion.Tests/InteractiveMapCompanion.Tests.csproj
            loader: bepinex
          - name: Sprint
            project: src/mods/Sprint/tests/Sprint.Tests/Sprint.Tests.csproj
            loader: lunaris
          - name: JusticeForF7
            project: src/mods/JusticeForF7/tests/JusticeForF7.Tests/JusticeForF7.Tests.csproj
            loader: lunaris
          - name: LoaderAdapters
            project: src/mods/tests/LoaderAdapter.Tests/LoaderAdapter.Tests.csproj
            loader: bepinex
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 9 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Run ${{ matrix.name }} tests
        run: |
          dotnet test "${{ matrix.project }}" \
            -c Release \
            -p:ModLoader=${{ matrix.loader }} \
            -p:ModVersion=0.0.0-test \
            --logger "trx;LogFileName=${{ matrix.name }}.trx" \
            --results-directory "$RUNNER_TEMP/test-results/${{ matrix.name }}" \
            -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload ${{ matrix.name }} TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mod-${{ matrix.name }}-trx
          path: ${{ runner.temp }}/test-results/${{ matrix.name }}/*.trx
          if-no-files-found: error

  # Summary job that all other jobs depend on
  # This makes it easy to require a single status check for branch protection
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [lint-python, lint-csharp, type-check, security, test-python, test-native-analyzers, test-native-mods]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.lint-python.result }}" != "success" ]] || \
             [[ "${{ needs.lint-csharp.result }}" != "success" ]] || \
             [[ "${{ needs.type-check.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.test-python.result }}" != "success" ]] || \
             [[ "${{ needs.test-native-analyzers.result }}" != "success" ]] || \
             [[ "${{ needs.test-native-mods.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully!"
