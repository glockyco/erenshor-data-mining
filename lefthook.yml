min_version: 2.1.0

output:
  - execution
  - failure

# Every job that needs a project tool goes through scripts/with-dev-env.sh.
# Git clients that are not shells (Fork, IDE integrations) run hooks with the
# bare launchd PATH, where uv, pnpm and dotnet do not exist.

pre-commit:
  piped: true
  jobs:
    - name: whitespace
      run: git diff --cached --check

    - name: ruff format
      glob: "*.py"
      run: scripts/with-dev-env.sh ruff format {staged_files}
      stage_fixed: true

    - name: ruff check
      glob: "*.py"
      run: scripts/with-dev-env.sh ruff check --fix {staged_files}
      stage_fixed: true

    - name: maps lint
      glob:
        - "src/maps/*.{js,ts,svelte,cjs,mjs,json}"
        - "src/maps/**/*.{js,ts,svelte,cjs,mjs,json}"
      run: scripts/with-dev-env.sh pnpm --filter erenshor-maps lint

    - name: csharpier
      glob: "src/mods/**/*.cs"
      run: scripts/with-dev-env.sh bash src/mods/run-csharpier.sh {staged_files}
      stage_fixed: true

    - name: stylua
      glob: "*.lua"
      run: scripts/with-dev-env.sh pnpm exec stylua --check {staged_files}

    - name: plans docs
      glob: "docs/plans/**/*.md"
      run: omp-plans index && omp-plans check
      stage_fixed: true
      skip:
        - run: "! command -v omp-plans"

    # gitleaks ships in the dev shell, so a missing binary is a broken
    # environment rather than a reason to push unscanned changes.
    - name: gitleaks
      run: scripts/with-dev-env.sh gitleaks git --pre-commit --staged --redact --verbose

commit-msg:
  jobs:
    - name: commitlint
      run: scripts/with-dev-env.sh pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: unit
      run: scripts/with-dev-env.sh erenshor test unit

    - name: contract
      run: scripts/with-dev-env.sh erenshor test contract
