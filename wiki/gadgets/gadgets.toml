owned_names = ["erenshor", "erenshor-api", "item-tooltips", "semantic-link-picker"]

[[gadgets]]
name = "erenshor"
options = ["ResourceLoader", "default", "hidden", "type=styles"]
sources = ["erenshor.css"]

[[gadgets]]
name = "erenshor-api"
options = ["ResourceLoader", "hidden", "dependencies=mediawiki.api"]
sources = ["erenshor-api.js"]

[[gadgets]]
name = "item-tooltips"
options = ["ResourceLoader", "default", "hidden"]
sources = ["item-tooltips.js"]

[[gadgets]]
name = "semantic-link-picker"
options = ["ResourceLoader", "default", "rights=edit"]
sources = ["semantic-link-picker-core.js", "semantic-link-picker.js", "semantic-link-picker.css"]
