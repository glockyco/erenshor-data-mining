<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Erenshor Map Scale Bar Mockup</title>
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #252529;
      --panel-2: #19191d;
      --ink: #f4f4f5;
      --muted: #d4d4d8;
      --line: rgba(255,255,255,.22);
      --accent: #e2b15a;
      --purple: #8b5cf6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .grid {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #05070a;
    }
    .scene {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }
    .world {
      display: grid;
      grid-template-columns: 286px 1fr;
      background: #111;
    }
    .sidebar {
      position: relative;
      z-index: 2;
      background: #29292c;
      border-right: 1px solid #3f3f46;
      color: #fafafa;
      padding: 8px 8px 24px;
      box-shadow: 8px 0 24px rgba(0,0,0,.18);
    }
    .home {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 34px;
      margin-bottom: 18px;
      color: #e8e8ec;
      font-size: 15px;
    }
    .search {
      border-radius: 5px;
      background: #303036;
      border: 1px solid #383841;
      color: #bfc1c8;
      height: 42px;
      display: flex;
      align-items: center;
      padding: 0 13px;
      margin-bottom: 20px;
    }
    .section {
      padding: 13px 0;
      border-top: 1px solid #3a3a40;
      color: #d7d7dc;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 13px 0;
      font-size: 16px;
      color: #f0f0f2;
      text-transform: none;
      letter-spacing: 0;
    }
    .sq {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #8b5cf6;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
    }
    .map-art {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(28deg, rgba(0,0,0,.1), rgba(0,0,0,.18)),
        radial-gradient(ellipse at 32% 27%, #834735 0 18%, transparent 31%),
        radial-gradient(ellipse at 57% 36%, #7d855b 0 18%, transparent 30%),
        radial-gradient(ellipse at 76% 50%, #6c7046 0 18%, transparent 32%),
        radial-gradient(ellipse at 42% 72%, #4c5d37 0 22%, transparent 34%),
        linear-gradient(135deg, #8b684b 0%, #5f6f47 42%, #394b31 70%, #2f3a2c 100%);
    }
    .map-art::before {
      content: "Fermalla's Revival Plain";
      position: absolute;
      left: 12%;
      top: 13%;
      transform: rotate(-11deg);
      font-family: Georgia, serif;
      font-size: clamp(32px, 5vw, 68px);
      font-weight: 900;
      color: rgba(244,244,245,.78);
      text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 8px rgba(0,0,0,.65);
      white-space: nowrap;
    }
    .map-art::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(72deg, transparent 38%, rgba(139,92,246,.8) 39%, rgba(139,92,246,.8) 40%, transparent 41%),
        linear-gradient(155deg, transparent 48%, rgba(139,92,246,.7) 49%, rgba(139,92,246,.7) 50%, transparent 51%);
      opacity: .75;
    }
    .zone-tile {
      position: absolute;
      width: 150px;
      height: 112px;
      background: linear-gradient(135deg, #6f7f55, #172016 70%);
      border: 1px solid rgba(0,0,0,.65);
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
    }
    .zone-tile.one { left: 40%; top: 24%; transform: rotate(3deg); }
    .zone-tile.two { left: 65%; top: 30%; transform: rotate(-1deg); }
    .zone-tile.three { left: 20%; top: 48%; transform: rotate(-18deg); }
    .pin {
      position: absolute;
      z-index: 3;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #c47a2b;
      border: 2px solid rgba(255,255,255,.75);
      box-shadow: 0 0 0 2px rgba(0,0,0,.2);
    }
    .pin.a { left: 55%; top: 35%; }
    .pin.b { left: 63%; top: 42%; background: #38a5d7; }
    .pin.c { left: 33%; top: 57%; background: #8b5cf6; }
    .zone {
      background:
        radial-gradient(circle at 58% 36%, rgba(67, 153, 166, .75), transparent 18%),
        radial-gradient(circle at 70% 50%, rgba(85, 82, 134, .8), transparent 17%),
        radial-gradient(circle at 23% 52%, rgba(83, 77, 65, .9), transparent 24%),
        #08090d;
    }
    .zone::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .zone .toolbar {
      position: absolute;
      left: 10px;
      top: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      z-index: 3;
    }
    .dark-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 11px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 4px;
      background: rgba(24, 24, 27, .96);
      color: #f4f4f5;
      box-shadow: 0 1px 5px rgba(0,0,0,.35);
      font-weight: 700;
      font-size: 14px;
    }
    .zoom-stack {
      display: grid;
      width: 34px;
      border: 1px solid rgba(0,0,0,.55);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 1px 5px rgba(0,0,0,.25);
    }
    .zoom-stack span {
      display: grid;
      place-items: center;
      height: 34px;
      background: #f8f8f8;
      color: #111;
      font-size: 24px;
      font-weight: 700;
    }
    .zoom-stack span + span { border-top: 1px solid #bbb; }
    .dot {
      position: absolute;
      z-index: 2;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #2137cf;
      border: 2px solid white;
      box-shadow: inset 0 0 0 2px #2137cf, 0 0 0 1px rgba(0,0,0,.55);
    }
    .dot.one { left: 22%; top: 33%; }
    .dot.two { left: 52%; top: 45%; }
    .dot.three { left: 74%; top: 29%; }
    .dot.four { left: 60%; top: 68%; }
    .scale-rule {
      position: absolute;
      left: 24px;
      bottom: 22px;
      z-index: 5;
      width: max-content;
      color: #fff;
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .03em;
      text-shadow:
        0 1px 2px rgba(0,0,0,.95),
        1px 0 1px rgba(0,0,0,.9),
        -1px 0 1px rgba(0,0,0,.9),
        0 -1px 1px rgba(0,0,0,.9);
      pointer-events: none;
    }
    .world .scale-rule { left: 310px; }
    .scale-label { margin-bottom: 5px; }
    .scale-line {
      position: relative;
      width: 116px;
      height: 16px;
      color: #f8fafc;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.95)) drop-shadow(0 0 2px rgba(0,0,0,.85));
    }
    .scale-line::before,
    .scale-line::after,
    .mid {
      content: "";
      position: absolute;
      bottom: 0;
      width: 2px;
      background: currentColor;
    }
    .scale-line::before { left: 0; height: 15px; }
    .scale-line::after { right: 0; height: 15px; }
    .mid { left: 50%; height: 9px; }
    .rail {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: currentColor;
    }
    .note {
      position: absolute;
      right: 16px;
      bottom: 14px;
      z-index: 4;
      max-width: 310px;
      color: rgba(255,255,255,.76);
      font-size: 12px;
      line-height: 1.35;
      text-align: right;
      text-shadow: 0 1px 2px rgba(0,0,0,.9);
    }
    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      .scene { min-height: 70vh; }
    }
  </style>
</head>
<body>
  <main class="grid">
    <section class="scene world" aria-label="World map scale mockup">
      <aside class="sidebar">
        <div class="home">⌂ Home</div>
        <div class="search">⌕ Search...</div>
        <div class="section">Enemy Spawn Points<div class="check"><span class="sq"></span>Unique</div><div class="check"><span class="sq" style="background:#d94c6a"></span>Rare</div><div class="check"><span class="sq" style="background:#c47a2b"></span>Common</div></div>
        <div class="section">Terrain<div class="check"><span class="sq" style="background:#71717a"></span>Zone Tiles</div><div class="check"><span class="sq" style="background:#71717a"></span>World Map</div></div>
      </aside>
      <div class="map-art">
        <div class="zone-tile one"></div><div class="zone-tile two"></div><div class="zone-tile three"></div>
        <span class="pin a"></span><span class="pin b"></span><span class="pin c"></span>
        <div class="scale-rule" aria-label="Scale: 250 Erenshor coordinate units"><div class="scale-label">250 units</div><div class="scale-line"><span class="rail"></span><span class="mid"></span></div></div>
      </div>
    </section>
    <section class="scene zone" aria-label="Zone map scale mockup">
      <div class="toolbar"><div class="dark-control">📍 Match Coordinates</div><div class="zoom-stack"><span>+</span><span>−</span></div></div>
      <span class="dot one"></span><span class="dot two"></span><span class="dot three"></span><span class="dot four"></span>
      <div class="scale-rule" aria-label="Scale: 100 Erenshor coordinate units"><div class="scale-label">100 units</div><div class="scale-line" style="width:98px"><span class="rail"></span><span class="mid"></span></div></div>
      <p class="note">No card. The rule floats like native map ink, using a halo for readability over busy art.</p>
    </section>
  </main>
</body>
</html>
