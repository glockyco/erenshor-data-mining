# Erenshor Vault listing for Justice for F7.
#
# Source of truth for the Vault mod listing. Used manually today (paste into
# erenshorvault.app/new-mod, then Versions -> new); `erenshor mod vault --mod
# justice-for-f7` reads it to build the DLL with the next version. See the
# mod-pipeline skill and ../../AdventureGuide/vault/AGENTS.md for the workflow.

[mod]
# POST /api/mods create fields.
name = "Justice for F7"
mod_ref = "justice-for-f7"
short_description = "Extends the F7 Hide UI key to also hide nameplates, damage numbers, target rings, XP orbs, cast bars, and loot prompts for truly clean screenshots."
# Public source repository, or "" to omit.
source_url = ""
hidden = false
# Tag slugs; resolve to tagIds via GET https://erenshorvault.app/api/tags.
tags = ["ui", "quality-of-life"]

[assets]
full_description = "README.md"
changelog = "CHANGELOG.md"
icon = "icon.png"

[package]
# Vault package zip layout: <mod_ref>/manifest.json + these files.
# Lunaris provides 0Harmony, so the package ships only the plugin assembly.
main_file = "JusticeForF7.dll"
asset_files = []
