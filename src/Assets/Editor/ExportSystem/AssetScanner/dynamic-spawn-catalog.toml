position_strategy = "vith_arena_fight"
reason = "Fight lists use VithArena.SpawnPiece semantics: 1 enemy -> SpawnLoc1, 2 enemies -> SpawnLoc2/SpawnLoc3, 3 enemies -> all three spawn locs."

[[allowed]]
