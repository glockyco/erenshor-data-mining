reason = "ActualSims is exported separately as authored prefab defaults. BlankSPTemplate creates generated sims. Neither establishes fixed world spawns."

[[denied]]
script = "SpellEffectDB"
fields = ["DruidPets"]
reason = "Spell effect database reference, not a spawn source."

[[denied]]
script = "SpiderEvent"
fields = ["Spider1", "Spider2", "Spider3", "Spider4"]
reason = "Linked spider references checked for Alive status, not Instantiate spawns."

[[denied]]
script = "Stats"
