reason = "Host character reference (GetComponent<Character>), not a dynamic spawn."

[[denied]]
script = "SimPlayer"
fields = ["Myself"]
reason = "Serialized host character cache resolved with GetComponent<Character>, not a dynamic spawn."

[[denied]]
script = "VitheoFight"
fields = ["RestoredVitheo"]
reason = "Unused field. The restored Vitheo reveal is VithArena.RestoredVitheo."

[[denied]]
script = "WardLeakListener"
fields = ["MyChar"]
reason = "Host character reference, not a dynamic spawn."

[[denied]]
script = "NPCSpawnEnvDmg"
fields = ["DmgToSpawn"]
reason = "Damage-area object assigned to DmgObj, not a Character spawn."

