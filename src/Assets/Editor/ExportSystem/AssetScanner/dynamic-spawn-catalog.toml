position_strategy = "vitheo_fight"
reason = "SpawnLegions uses CorruptorSpawn for single corruptors, the first count arenaNav positions for legions, and all arenaNav positions for the infinite LegionTier4 phase."

[[denied]]
script = "BraxFightEvent"
fields = ["IceGolem", "LavaGolem"]
reason = "Assigned to SpawnOnDeath at runtime, not Instantiate."

[[denied]]
script = "CastSpell"
fields = ["MyChar"]
reason = "Host character reference (GetComponent<Character>), not a dynamic spawn."

[[denied]]
script = "CharSelectManager"
fields = ["PlayerChar"]
reason = "Player character reference, not a dynamic spawn."

[[denied]]
script = "ClearAggroOnDistance"
fields = ["MyChar"]
reason = "Host character reference (GetComponent<Character>), not a dynamic spawn."

[[denied]]
script = "CombinedMeshesManager"
fields = ["rootGameObject"]
reason = "Mesh-combining utility referencing the GameObject it manages; not a spawn source."

[[denied]]
script = "FernallaPortalShouts"
fields = ["StopIfDead"]
reason = "Character reference checked for Alive status, not a spawn source."

[[denied]]
script = "GuildManager"
fields = ["PossibleMobTargets"]
reason = "Target list for guild tasks (GetComponent<Stats>), not a spawn source."

[[denied]]
script = "InfernoTwins"
fields = ["Chest"]
reason = "Declared but never instantiated in the script; dead field."

[[denied]]
script = "MiningNode"
fields = ["MyChar"]
reason = "Host character reference, not a dynamic spawn."

[[denied]]
script = "Misc"
fields = ["TreasureChest0_10", "TreasureChest10_20", "TreasureChest20_30", "TreasureChest30_35"]
reason = "Singleton-accessed prefabs (GameData.Misc.TreasureChest*) instantiated by PlayerControl.LeftClick() at the clicked treasure marker's position. No serialized field on PlayerControl — the listener cannot emit rows. Spawns are player-triggered at runtime-determined positions (Category C-like). Handle via mapping rules: wiki-visible for loot, not map-visible for dynamic positions."

[[denied]]
script = "Misc"
fields = ["TrickShotTarg"]
reason = "Singleton-accessed prefab (GameData.Misc.TrickShotTarg) instantiated by NPC.cs and PlayerCombat.cs at a random NavMesh point during combat. No serialized field on the consuming scripts — the listener cannot emit rows. Combat-triggered spawn at a runtime-determined position. Handle via mapping rules: not wiki-visible (no loot/content), not map-visible."

[[denied]]
script = "MultiQuestListener"
fields = ["EnableOnQuestComplete"]
reason = "List of GameObjects enabled via SetActive on quest completion, not Instantiate spawns."

[[allowed]]
script = "NPCDialog"
fields = ["Spawn"]
# Instantiated by NPCDialogManager.DoExtras() at the dialog NPC's transform
# position when the dialog completes. The field is a serialized prefab reference
# on the NPCDialog component itself, so the listener emits at the host's position.

[[denied]]
script = "PietyTrigger"
fields = ["Piety"]
reason = "Unused character reference, not consulted by the guardian quest gate."

[[denied]]
script = "PlayerControl"
fields = ["Myself"]
reason = "Player character reference, not a dynamic spawn."

[[denied]]
script = "QuestSpawnListener"
fields = ["DestroyOnQuestComplete", "EnableOnQuestComplete"]
reason = "Enable and disable effects are exported by QuestActivationListener, not dynamic spawn sources."

[[denied]]
script = "ShapeshiftMngr"
fields = ["MyChar"]
reason = "Host character reference, not a dynamic spawn."

[[denied]]
script = "SimPlayerMngr"
