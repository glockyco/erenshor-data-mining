# Dynamic Spawn Source Catalog
# Classifies serialized Character/GameObject fields on event-script MonoBehaviours.
# Update this file when the export's dynamic-spawn-errors.json reports unknown
# candidates. Classify each pair as allowed, denied, or activation.
# Each allowed entry states with summoned_by who must be present or dead
# before its fields spawn: "host" for the controller's own Character or
# SpawnPoint, "checked_in" for the characters that check in with it, or a
# controller field that holds a SpawnPoint or a Character prefab. summon is
# "alive" when any summoner must be fighting, "defeated" when every summoner
# must be dead, or "dialog" when the player says the host's spawning dialog.
# See: skill://auditing-spawn-coverage

schema_version = 1

# --- Category A: direct event-script spawns (emit to character_spawns) ---

