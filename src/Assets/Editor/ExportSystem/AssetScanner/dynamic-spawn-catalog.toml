# --- Denied: runtime-rebound trackers (host SpawnPoint already covers placement) ---

[[denied]]
script = "FaithEvent"
fields = ["Faith"]
reason = "Runtime-rebound from MySpawn.SpawnedNPC; the originating SpawnPoint already covers placement."

[[allowed]]
script = "FaithEvent"
fields = ["HealObject"]
position_field = "SpawnLocsForHeals"
reason = "Heal NPC instantiated at SpawnLocsForHeals; has Character component via FaithTracker pattern."

[[denied]]
script = "GraceEvent"
fields = ["Grace"]
reason = "Runtime-rebound from MySpawn.SpawnedNPC; the originating SpawnPoint already covers placement."

[[denied]]
script = "RewardListener"
fields = ["Frost", "Inferno"]
reason = "Runtime tracker fields, not world placements."

[[denied]]
script = "SprinklesEvent"
fields = ["Sprinkles"]
reason = "Runtime-rebound from MySpawn.SpawnedNPC; the originating SpawnPoint already covers placement."

[[denied]]
script = "MizukiEvent"
fields = ["MizChar"]
reason = "Runtime-rebound from MySpawn.SpawnedNPC; the originating SpawnPoint already covers placement."

[[denied]]
script = "ZenithNadirScript"
fields = ["Zenith", "Nadir", "SyzygyChar"]
reason = "Runtime-rebound or direct Character references already placed via SpawnPoint."

[[denied]]
script = "FernallaFightEvent"
fields = ["MyChar"]
reason = "Host character, placed via SpawnPoint; not a dynamic spawn."

[[denied]]
script = "StowawayPortal"
fields = ["Keeper", "Skeletons", "KeeperSpawn"]
reason = "Keeper is placed via SpawnPoint; Skeletons is a runtime-populated List<Character> accumulator (Add at runtime, not serialized prefabs); KeeperSpawn is a position marker."

# --- Captured separately: zone-wide random spawners, not fixed placements ---

[[denied]]
script = "Misc"
fields = ["SivakayanSpectres"]
reason = "ZoneWideSpawnListener captures weighted candidates and zone-wide eligibility without fixed placements."

# --- Denied: non-Character GameObject fields ---

[[denied]]
script = "MizukiEvent"
fields = ["FinalPush", "DoubleSpawn"]
reason = "Declared but never referenced outside declaration; dead fields."

[[denied]]
script = "AstraListener"
fields = ["Beam"]
reason = "Visual effect toggle (SetActive), not an Instantiate spawn."

[[denied]]
script = "SiraetheEvent"
fields = ["WardOne", "WardTwo", "WardThree"]
reason = "Position markers, not Character prefabs."

[[denied]]
script = "ZenithNadirScript"
fields = ["ConstellationMobs"]
reason = "Declared but never referenced outside declaration; dead field."

[[allowed]]
script = "VithArena"
fields = ["AwardChests"]
position_field = "ChestSpawnPos"
reason = "Arena reward chest, instantiated at ChestSpawnPos; prefab has Character component with loot."

[[denied]]
script = "VithArena"
fields = ["SpawnLoc1", "SpawnLoc2", "SpawnLoc3", "ChestSpawnPos"]
reason = "Position markers consumed by the fight position strategy and AwardChests."

[[denied]]
script = "WaveEvent"
fields = ["SpawnLocations"]
reason = "Position marker list; the actual spawn fields are WeakWave/StrongWave/etc."

[[denied]]
script = "HonsusScript"
fields = ["NavPoints"]
reason = "Navigation waypoints, not Character prefabs."

[[allowed]]
script = "MalarothFeed"
fields = ["Malaroth"]
position_field = "SpawnLoc"
include_host_position = true
trigger_item_field = "MalarothFood"
trigger_mode = "proximity_auto_consume"
event_display_name = "Malaroth feeding site"
include_host_bounds = true
reason = "SpawnLoc is the NPC instantiate position; the component host transform and trigger bounds define the interaction site."

[[allowed]]
script = "MalarothFeed"
fields = ["Demented"]
position_field = "SpawnLoc"
include_host_position = true
trigger_item_field = "BadFood"
trigger_mode = "proximity_auto_consume"
event_display_name = "Malaroth feeding site"
include_host_bounds = true
reason = "SpawnLoc is the NPC instantiate position; the component host transform and trigger bounds define the interaction site."

[[denied]]
script = "TreasureChestEvent"
fields = ["LiveGuardians", "Lid"]
reason = "LiveGuardians is a runtime list; Lid is a chest mesh."

[[denied]]
script = "FernallaPortalEvent"
fields = ["Invader"]
reason = "Declared but never used in the script; dead field."

[[denied]]
script = "GraceEvent"
fields = ["Spawn2"]
reason = "Position marker (second spawn point for AnimDupe); Spawn1 is used as position_field."

[[allowed]]
script = "RewardListener"
fields = ["Chest"]
position_field = "ChestSpawn"
reason = "Reward chest, instantiated at ChestSpawn; prefab has Character component with loot."

[[denied]]
script = "AstraListener"
fields = ["Astra", "SpawnLoc"]
reason = "Astra is the host NPC (assigned from Instantiate result); SpawnLoc is a position marker."

[[allowed]]
script = "ZenithNadirScript"
fields = ["Chest"]
position_field = "ChestPos"
reason = "Reward chest, instantiated at ChestPos; prefab has Character component with loot."

[[denied]]
script = "ZenithNadirScript"
fields = ["ConstPt1", "ConstPt2", "SyzSpawn", "ChestPos"]
reason = "Position markers; SyzSpawn is used as position_field for Syzygy/ConstellationStar."

[[denied]]
script = "MizukiEvent"
fields = ["MizGameObject", "SpawnSmoke", "WarpSmoke", "EndNode"]
reason = "UI/FX/node prefabs, not Characters."

[[denied]]
script = "NPCFightEvent"
fields = ["MyNPC"]
reason = "Host NPC reference, not a dynamic spawn."

[[allowed]]
script = "ArborScript"
fields = ["Sapling"]
position_field = "SapSpawn1,SapSpawn2"

[[allowed]]
script = "BraxFightEvent"
