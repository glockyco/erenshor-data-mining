services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: mediawiki
      MYSQL_USER: wiki
      MYSQL_PASSWORD: wiki
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - type: ${WIKI_DB_MOUNT_TYPE:-bind}
        source: ${WIKI_DB_MOUNT_SOURCE:-./db}
        target: /var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql --protocol=TCP -h 127.0.0.1 -uwiki -pwiki -D mediawiki -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  mediawiki:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WIKI_HOST_PORT:-8088}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MEDIAWIKI_DB_HOST: db
      MEDIAWIKI_DB_NAME: mediawiki
      MEDIAWIKI_DB_USER: wiki
      MEDIAWIKI_DB_PASSWORD: wiki
    volumes:
      - ./LocalSettings.extra.php:/var/www/html/LocalSettings.extra.php:ro
      - type: ${WIKI_RUNTIME_MOUNT_TYPE:-bind}
        source: ${WIKI_RUNTIME_MOUNT_SOURCE:-./runtime}
        target: /workspace/wiki-dev-runtime
      - type: ${WIKI_IMAGES_MOUNT_TYPE:-bind}
        source: ${WIKI_IMAGES_MOUNT_SOURCE:-./images}
        target: /var/www/html/images
      - ../wiki:/workspace/wiki:ro

volumes:
  clean-db:
  clean-images:
  clean-runtime:
